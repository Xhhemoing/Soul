[package]
name = "soul-collect"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
description = "Foreground application duration collection: a platform source behind a trait, a consent gate in front of every write, and sealed events at the end."

# No database and no window-title API. The events go through
# `soul-store-api`, the gate is `soul-policy`'s consent ledger, and the only
# platform code is the Windows foreground-process lookup in `src/windows.rs`,
# which is compiled out everywhere else.
[dependencies]
soul-schema = { workspace = true }
soul-store-api = { workspace = true }
soul-policy = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
soul-store = { workspace = true }
soul-testkit = { workspace = true }
tempfile = { workspace = true }
