<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
<title id="title">Soul 已接入的起草任务框架</title><desc id="desc">页面与桥接检查归属。Session 在锁内准备与发许可，worker 在锁外请求网络，完成后回到锁内审计与检查。端点撤回和资料变化使旧结果失效；worker 真实结束前保持唯一槽。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#32715e"/></marker><marker id="deny" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ab6739"/></marker></defs>
<rect width="1000" height="650" rx="20" fill="#f5f7f0"/>
<g font-family="'Noto Sans CJK SC',system-ui,'Microsoft YaHei',sans-serif" fill="#203f34">
<text x="40" y="46" font-size="24" font-weight="700">起草路径 · 生产源码接线</text><text x="40" y="76" font-size="15" fill="#64756d">单 Session / 单 WebView · 不新增 IPC 字段或持久化 schema</text>
<g stroke="#cad9cc" fill="#fff"><rect x="40" y="108" width="590" height="78" rx="12"/><rect x="40" y="226" width="590" height="78" rx="12"/><rect x="40" y="344" width="590" height="78" rx="12" fill="#e4efdf"/><rect x="40" y="462" width="590" height="94" rx="12"/><rect x="700" y="108" width="260" height="196" rx="12" fill="#fff2e6"/><rect x="700" y="462" width="260" height="94" rx="12" fill="#fff2e6"/></g>
<g font-size="19" font-weight="650"><text x="62" y="139">01 · React 页面 + core.ts</text><text x="62" y="257">02 · Session 锁内：准备与派发</text><text x="62" y="375">03 · 锁外 worker：执行</text><text x="62" y="493">04 · Session 锁内：接收</text><text x="722" y="141">资料 / 授权变化</text><text x="722" y="494">拒收过时回复</text></g>
<g font-size="15"><text x="62" y="165">输入代次、确认绑定；变更等待期拒绝新起草；交付前再核验</text><text x="62" y="283">冻结原正文与来源；匹配 preparation ID / plan hash；消费一次许可</text><text x="62" y="401">HTTP 与解析不占 Session 锁；唯一任务槽直到实际结束仍占用</text><text x="62" y="519">先记录已发生出网，再核对来源与单调期限</text><text x="62" y="541">通过后记录 draft.create；界面再核对归属，仍只生成草稿</text><text x="722" y="174">设置 / 清除模型端点</text><text x="722" y="202">档案、导入、记忆、关系修改</text><text x="722" y="230">丢弃准备同时拒收在途结果</text><text x="722" y="272" fill="#9b572e">不撤回已发许可或已送出字节</text><text x="722" y="523">保留必要出网审计</text><text x="722" y="545">不返回旧草稿或记 draft.create</text></g>
<g fill="none" stroke="#32715e" stroke-width="2.5" marker-end="url(#arrow)"><path d="M335 186V224"/><path d="M335 304V342"/><path d="M335 422V460"/></g>
<g fill="none" stroke="#ab6739" stroke-width="2.5" stroke-dasharray="7 5" marker-end="url(#deny)"><path d="M700 147H632"/><path d="M700 264H632"/><path d="M830 304V460"/><path d="M630 508H698"/></g>
<text x="40" y="605" font-size="16">范围：解除起草 HTTP 对会话的长期占用。摘要、目录扫描、导入仍可能占锁。</text><text x="40" y="630" font-size="14" fill="#64756d">实现状态不等于平台验收；原生 IPC 与 Windows 门禁须分别验证。2026-10-16</text>
</g></svg>
